<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIMBEL SAINS - Management System Real</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen text-slate-800">

  <!-- Container Utama Mobile First -->
  <div class="w-full max-w-md md:max-w-4xl bg-slate-100 min-h-screen flex flex-col justify-between shadow-2xl relative pb-20">

    <!-- HEADER / TOPBAR -->
    <header id="appHeader" class="bg-brand-600 text-white px-4 pt-5 pb-6 rounded-b-[2rem] shadow-md relative z-20">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <button id="btnBack" onclick="navigateView('dashboard')" class="text-white hover:bg-white/20 p-1.5 rounded-full transition hidden">
            <i class="fa-solid fa-arrow-left text-base"></i>
          </button>
          <div class="bg-white text-brand-700 font-extrabold text-xs px-3 py-1 rounded-full shadow flex items-center gap-1.5">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Bimbel SAINS</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span id="userRoleBadge" class="bg-amber-400 text-brand-950 font-black text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wide">
            SUPERADMIN
          </span>
          <button onclick="refreshCurrentView()" class="bg-brand-500 hover:bg-brand-400 text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 font-medium transition shadow-sm">
            <span>Refresh</span>
            <i id="refreshIcon" class="fa-solid fa-rotate text-[10px]"></i>
          </button>
        </div>
      </div>

      <div class="flex justify-between items-end mt-1">
        <div>
          <p class="text-[11px] text-blue-200 font-medium">Status saya</p>
          <h1 id="userDisplayName" class="text-sm font-bold text-white tracking-wide uppercase">ADMINISTRATOR UTAMA</h1>
        </div>
        <button onclick="handleLogout()" class="text-xs bg-red-500/80 hover:bg-red-600 px-2.5 py-1 rounded-lg transition text-white flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main id="mainContent" class="px-4 -mt-3 z-10 flex-1 space-y-4">
      <!-- Dynamic Views rendered via JS -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto bg-white border-t border-slate-200 px-4 py-2 flex justify-between items-center z-50 rounded-t-2xl shadow-lg">
      <div class="bg-slate-800 text-white text-[11px] rounded-full px-2.5 py-1 flex items-center gap-1.5 font-bold shadow">
        <i class="fa-regular fa-eye"></i>
        <span id="visitorCounter">0</span>
      </div>

      <button onclick="navigateView('presensi')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-regular fa-calendar-check text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Presensi</span>
      </button>

      <div class="-mt-6">
        <button onclick="navigateView('semua_menu')" class="w-12 h-12 rounded-full bg-brand-600 border-4 border-slate-100 text-white flex items-center justify-center text-lg shadow-lg hover:bg-brand-700 transition">
          <i class="fa-solid fa-grip"></i>
        </button>
      </div>

      <button onclick="navigateView('laporan')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-solid fa-file-invoice text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Laporan</span>
      </button>

      <button onclick="navigateView('profil')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-regular fa-user text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Profil</span>
      </button>
    </nav>

  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div id="modalCard" class="bg-white rounded-2xl w-full max-w-md p-5 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <!-- Modal Content Dynamic -->
    </div>
  </div>

  <!-- JAVASCRIPT & REAL SUPABASE INTEGRATION -->
  <script>
    // 1. KREDENSIAL REAL SUPABASE
    const SUPABASE_URL = 'https://dbfzscedfnonjllwvhaw.supabase.co';
    const SUPABASE_KEY = 'Sb_publishable_LsfH-aNxfqMyeCw4F3KPzw_QEUB5o8f';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentView = 'dashboard';

    // 2. INISIALISASI SAAT HALAMAN DIMUAT
    document.addEventListener('DOMContentLoaded', async () => {
      await recordVisitorReal();
      await fetchVisitorCountReal();
      navigateView('dashboard');
    });

    // 3. FITUR PENGUNJUNG REAL (VISITORS)
    async function recordVisitorReal() {
      try {
        await sb.from('visitors').insert([{}]);
      } catch (err) {
        console.error('Error recording visitor:', err);
      }
    }

    async function fetchVisitorCountReal() {
      try {
        const { count, error } = await sb.from('visitors').select('*', { count: 'exact', head: true });
        if (!error && count !== null) {
          document.getElementById('visitorCounter').innerText = count;
        }
      } catch (err) {
        console.error('Error fetching visitor count:', err);
      }
    }

    // 4. ROUTING & NAVIGATION
    function navigateView(viewName) {
      currentView = viewName;
      const main = document.getElementById('mainContent');
      const btnBack = document.getElementById('btnBack');

      if (viewName === 'dashboard') {
        btnBack.classList.add('hidden');
      } else {
        btnBack.classList.remove('hidden');
      }

      switch (viewName) {
        case 'dashboard':
          renderDashboardReal(main);
          break;
        case 'management_panel':
          renderManagementPanelReal(main);
          break;
        case 'semua_menu':
          renderSemuaMenu(main);
          break;
        case 'kelola_user':
          renderKelolaUserReal(main);
          break;
        case 'kelola_siswa':
          renderKelolaSiswaReal(main);
          break;
        case 'kelola_kelas':
          renderKelolaKelasReal(main);
          break;
        case 'presensi':
        case 'keuangan':
        case 'laporan':
        case 'broadcast':
        case 'setting_web':
        case 'database':
        case 'profil':
          renderModulePlaceholder(main, viewName);
          break;
        default:
          renderDashboardReal(main);
      }
    }

    function refreshCurrentView() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      setTimeout(() => {
        navigateView(currentView);
        fetchVisitorCountReal();
        refreshIcon.classList.remove('fa-spin');
      }, 500);
    }

    // 5. RENDER DASHBOARD REAL DATA
    async function renderDashboardReal(container) {
      container.innerHTML = `
        <!-- Card 1: Panel Kendali Pusat -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <h2 class="text-base font-bold text-slate-800 mb-0.5">Panel Kendali Pusat Bimbel</h2>
          <p class="text-xs font-semibold text-slate-500">
            Total Murid: <span id="dashMurid" class="text-slate-800 font-bold">...</span> | 
            Total Guru: <span id="dashGuru" class="text-slate-800 font-bold">...</span>
          </p>
        </div>

        <!-- Card 2: Ringkasan Operasional -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-house text-brand-600 text-sm"></i>
              <h3 class="text-xs font-bold text-brand-900">Ringkasan Keuangan & Operasional</h3>
            </div>
            <span class="bg-slate-900 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase">AKSES FULL</span>
          </div>
          <p class="text-[11px] text-slate-500 mb-3">Sistem terintegrasi secara real-time dengan Supabase.</p>
          <button onclick="navigateView('management_panel')" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow-md transition">
            Buka Management Panel
          </button>
        </div>

        <!-- Card 3: Grid Menu Utama -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="grid grid-cols-4 gap-y-4 gap-x-2 text-center">
            
            <div onclick="navigateView('kelola_user')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-red-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-users-gear"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Kelola User</span>
            </div>

            <div onclick="navigateView('keuangan')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-chart-pie"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Keuangan</span>
            </div>

            <div onclick="navigateView('kelola_kelas')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-brand-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-laptop"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Kelola Kelas</span>
            </div>

            <div onclick="navigateView('laporan')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-emerald-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-file-invoice"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Laporan Full</span>
            </div>

            <div onclick="navigateView('setting_web')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-indigo-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-gear"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Setting Web</span>
            </div>

            <div onclick="navigateView('broadcast')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-pink-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-bullhorn"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Broadcast</span>
            </div>

            <div onclick="navigateView('database')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-purple-600 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-database"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Database</span>
            </div>

            <div onclick="navigateView('semua_menu')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-brand-600 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-table-cells"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Semua Menu</span>
            </div>

          </div>
        </div>

        <!-- Banner Info -->
        <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-center text-xs py-3 px-4 rounded-xl shadow-sm border border-orange-400">
          * Untuk 10 Pendaftar Pertama di Awal Semester
        </div>
      `;

      // Ambil Total Data secara REAL dari Supabase
      const { count: countMurid } = await sb.from('students').select('*', { count: 'exact', head: true });
      const { count: countGuru } = await sb.from('teachers').select('*', { count: 'exact', head: true });

      document.getElementById('dashMurid').innerText = countMurid !== null ? countMurid : 0;
      document.getElementById('dashGuru').innerText = countGuru !== null ? countGuru : 0;
    }

    // 6. RENDER MANAGEMENT PANEL REAL DATA
    async function renderManagementPanelReal(container) {
      const { count: countMurid } = await sb.from('students').select('*', { count: 'exact', head: true });
      const { count: countGuru } = await sb.from('teachers').select('*', { count: 'exact', head: true });
      const { count: countKelas } = await sb.from('classes').select('*', { count: 'exact', head: true });

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
          <h2 class="text-base font-bold text-slate-800">Management Panel Administrator</h2>
          
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
              <p class="text-[10px] font-bold text-blue-600 uppercase">Total Murid</p>
              <p class="text-lg font-black text-blue-950">${countMurid || 0}</p>
            </div>
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
              <p class="text-[10px] font-bold text-emerald-600 uppercase">Total Guru</p>
              <p class="text-lg font-black text-emerald-950">${countGuru || 0}</p>
            </div>
            <div class="bg-purple-50 p-3 rounded-xl border border-purple-100">
              <p class="text-[10px] font-bold text-purple-600 uppercase">Total Kelas</p>
              <p class="text-lg font-black text-purple-950">${countKelas || 0}</p>
            </div>
          </div>

          <!-- Grafik Chart Real Template -->
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
            <h3 class="text-xs font-bold text-slate-700 mb-2">Statistik Pendaftaran & Operasional</h3>
            <canvas id="chartFinance" class="max-h-48"></canvas>
          </div>
        </div>
      `;

      setTimeout(() => {
        const ctx = document.getElementById('chartFinance').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Siswa', 'Guru', 'Kelas'],
            datasets: [{
              label: 'Jumlah Data Real',
              data: [countMurid || 0, countGuru || 0, countKelas || 0],
              backgroundColor: ['#2563eb', '#10b981', '#8b5cf6']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }, 100);
    }

    // 7. RENDER SEMUA MENU
    function renderSemuaMenu(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-4">
          <h2 class="text-base font-bold text-slate-800">Direktori Semua Menu</h2>

          <div>
            <span class="text-[11px] font-extrabold text-slate-400 tracking-wider">MASTER DATA</span>
            <div class="grid grid-cols-2 gap-2 mt-2">
              <button onclick="navigateView('kelola_siswa')" class="flex items-center gap-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-brand-50 transition">
                <i class="fa-solid fa-user-graduate text-brand-600"></i> Data Siswa
              </button>
              <button onclick="navigateView('kelola_user')" class="flex items-center gap-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-brand-50 transition">
                <i class="fa-solid fa-users text-red-500"></i> Data User
              </button>
            </div>
          </div>

          <div>
            <span class="text-[11px] font-extrabold text-slate-400 tracking-wider">AKADEMIK</span>
            <div class="grid grid-cols-2 gap-2 mt-2">
              <button onclick="navigateView('kelola_kelas')" class="flex items-center gap-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-brand-50 transition">
                <i class="fa-solid fa-laptop text-brand-500"></i> Kelola Kelas
              </button>
              <button onclick="navigateView('presensi')" class="flex items-center gap-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-brand-50 transition">
                <i class="fa-solid fa-clipboard-user text-emerald-600"></i> Presensi
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // 8. RENDER KELOLA USER (FETCH & INSERT REAL DARI TABEL PROFILES)
    async function renderKelolaUserReal(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-base font-bold text-slate-800">Kelola User (Database Real)</h2>
            <button onclick="openModalTambahUserReal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">
              + Tambah User
            </button>
          </div>

          <div id="userListContainer" class="space-y-2 text-xs">
            <p class="text-slate-400 italic">Memuat data langsung dari Supabase...</p>
          </div>
        </div>
      `;

      const { data: users, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
      const listContainer = document.getElementById('userListContainer');

      if (error) {
        listContainer.innerHTML = `<p class="text-red-500">Gagal mengambil data: ${error.message}</p>`;
        return;
      }

      if (!users || users.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-400 py-4 text-center">Belum ada data user di tabel 'profiles'. Silakan tambah data baru.</p>`;
        return;
      }

      listContainer.innerHTML = users.map(u => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-800">${u.nama_lengkap}</p>
            <p class="text-[10px] text-slate-500">${u.email} | <span class="text-brand-600 font-bold">${u.role || 'SISWA'}</span></p>
          </div>
          <button onclick="deleteUserReal('${u.id}')" class="text-red-500 hover:text-red-700 text-xs px-2 py-1">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function openModalTambahUserReal() {
      const modal = document.getElementById('modalCard');
      modal.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Tambah User Ke Supabase</h3>
        <form onsubmit="saveUserReal(event)" class="space-y-2.5 text-xs">
          <div>
            <label class="font-bold text-slate-600">Nama Lengkap</label>
            <input type="text" id="formNama" required class="w-full border p-2 rounded-lg mt-1">
          </div>
          <div>
            <label class="font-bold text-slate-600">Email</label>
            <input type="email" id="formEmail" required class="w-full border p-2 rounded-lg mt-1">
          </div>
          <div>
            <label class="font-bold text-slate-600">Role</label>
            <select id="formRole" class="w-full border p-2 rounded-lg mt-1">
              <option value="ADMIN">ADMIN</option>
              <option value="GURU">GURU</option>
              <option value="STAFF KEUANGAN">STAFF KEUANGAN</option>
              <option value="SISWA">SISWA</option>
            </select>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="submit" id="btnSaveUser" class="flex-1 bg-brand-600 text-white font-bold py-2 rounded-xl">Simpan Real</button>
            <button type="button" onclick="closeModal()" class="flex-1 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl">Batal</button>
          </div>
        </form>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    async function saveUserReal(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSaveUser');
      btn.innerText = 'Menyimpan...';
      btn.disabled = true;

      const nama = document.getElementById('formNama').value;
      const email = document.getElementById('formEmail').value;
      const role = document.getElementById('formRole').value;

      // Insert langsung ke tabel 'profiles' Supabase
      const { error } = await sb.from('profiles').insert([{
        nama_lengkap: nama,
        email: email,
        role: role
      }]);

      if (error) {
        alert('Gagal menyimpan ke Supabase: ' + error.message);
      } else {
        alert(`User ${nama} berhasil tersimpan secara nyata di Supabase!`);
        closeModal();
        renderKelolaUserReal(document.getElementById('mainContent'));
      }
    }

    async function deleteUserReal(id) {
      if (confirm('Apakah Anda yakin ingin menghapus user ini dari Supabase?')) {
        const { error } = await sb.from('profiles').delete().eq('id', id);
        if (error) {
          alert('Gagal menghapus: ' + error.message);
        } else {
          renderKelolaUserReal(document.getElementById('mainContent'));
        }
      }
    }

    // 9. RENDER KELOLA SISWA REAL
    async function renderKelolaSiswaReal(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-base font-bold text-slate-800">Data Siswa (Supabase Real)</h2>
          </div>
          <div id="siswaListContainer" class="space-y-2 text-xs">
            <p class="text-slate-400 italic">Memuat data siswa...</p>
          </div>
        </div>
      `;

      const { data: students, error } = await sb.from('students').select('*').order('created_at', { ascending: false });
      const listContainer = document.getElementById('siswaListContainer');

      if (error) {
        listContainer.innerHTML = `<p class="text-red-500">Gagal memuat: ${error.message}</p>`;
        return;
      }

      if (!students || students.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-400 py-4 text-center">Belum ada data siswa di tabel 'students'.</p>`;
        return;
      }

      listContainer.innerHTML = students.map(s => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-800">${s.nis} - ${s.nama_panggilan || 'Siswa'}</p>
            <p class="text-[10px] text-slate-500">Program: ${s.program || '-'}</p>
          </div>
          <span class="bg-blue-100 text-blue-700 text-[9px] font-bold px-2 py-0.5 rounded">${s.status}</span>
        </div>
      `).join('');
    }

    // 10. RENDER KELOLA KELAS REAL
    async function renderKelolaKelasReal(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-base font-bold text-slate-800">Data Kelas (Supabase Real)</h2>
          </div>
          <div id="kelasListContainer" class="space-y-2 text-xs">
            <p class="text-slate-400 italic">Memuat data kelas...</p>
          </div>
        </div>
      `;

      const { data: classes, error } = await sb.from('classes').select('*');
      const listContainer = document.getElementById('kelasListContainer');

      if (error) {
        listContainer.innerHTML = `<p class="text-red-500">Gagal memuat: ${error.message}</p>`;
        return;
      }

      if (!classes || classes.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-400 py-4 text-center">Belum ada kelas terdaftar di tabel 'classes'.</p>`;
        return;
      }

      listContainer.innerHTML = classes.map(c => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
          <p class="font-bold text-slate-800">${c.kode_kelas} - ${c.nama_kelas}</p>
          <p class="text-[10px] text-slate-500">Hari: ${c.hari || '-'} | Kapasitas: ${c.kapasitas}</p>
        </div>
      `).join('');
    }

    // HELPER MODAL & PLACEHOLDER
    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function renderModulePlaceholder(container, name) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-6 text-center border border-slate-100 shadow-sm">
          <i class="fa-solid fa-folder-open text-3xl text-brand-500 mb-2"></i>
          <h2 class="text-sm font-bold text-slate-800 uppercase">Modul ${name.replace('_', ' ')}</h2>
          <p class="text-xs text-slate-500 mt-1">Terhubung langsung dengan Supabase API.</p>
        </div>
      `;
    }

    function handleLogout() {
      if (confirm("Apakah Anda yakin ingin keluar dari sistem?")) {
        alert("Anda telah keluar.");
      }
    }
  </script>
</body>
</html>
