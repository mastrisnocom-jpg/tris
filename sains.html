<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimbel SAINS - Multi Role System</title>
    <!-- Font Awesome CDN untuk Ikon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f4f8;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        .hidden { display: none !important; }

        /* ================= HALAMAN LOGIN ================= */
        .login-screen {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            background: #ffffff;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: #007bff;
            margin-top: 10px;
        }

        .login-title span { color: #17a2b8; }

        .role-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
        }

        .role-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn.active {
            background: #007bff;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.3);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }

        .form-control:focus {
            border-color: #007bff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        /* ================= DASHBOARD UI ================= */
        .dashboard-screen {
            padding-bottom: 90px;
        }

        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 20px 16px 50px 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            background: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            color: #007bff;
            font-size: 14px;
        }

        .logo-box span { color: #17a2b8; }

        .user-section {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .header-icons {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .header-icons i { font-size: 18px; cursor: pointer; }

        .user-details { text-align: right; }
        .user-greeting { font-size: 10px; opacity: 0.9; }
        .user-name { font-weight: 800; font-size: 13px; }
        .user-role-badge { 
            display: inline-block;
            background: #ffc107;
            color: #000;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 8px;
            margin-top: 2px;
        }

        .btn-action-header {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Konten Utama */
        .container {
            padding: 0 16px;
            margin-top: -35px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .card h2 { font-size: 17px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .card p { font-size: 12px; color: #64748b; font-weight: 600; }
        .card p span { color: #0f172a; font-weight: 800; }

        .badge-diskon {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #1e5288;
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 800;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0056b3;
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .btn-program {
            background: #0056b3;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 12px;
            padding: 20px 12px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .menu-label {
            font-size: 10px;
            color: #334155;
            font-weight: 700;
            line-height: 1.2;
            max-width: 80px;
        }

        .banner-promo {
            background: linear-gradient(90deg, #ff6a00, #ff8800);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 65px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            flex: 1;
        }

        .nav-link i { font-size: 18px; margin-bottom: 3px; }
        .nav-link.active { color: #007bff; }

        .fab-container { position: relative; top: -16px; }
        .fab-btn {
            width: 52px;
            height: 52px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(0, 123, 255, 0.4);
            border: 4px solid #ffffff;
        }
        .fab-btn i { font-size: 20px; }
    </style>
</head>
<body>

    <!-- ================= 1. TAMPILAN LOGIN ================= -->
    <div id="loginScreen" class="login-screen">
        <div class="login-header">
            <div style="font-size: 40px; color: #007bff;"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="login-title">Bimbel <span>SAINS</span></div>
            <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Pilih Peran dan Masuk ke Akun Anda</p>
        </div>

        <!-- Role Selector Switcher -->
        <div class="role-selector">
            <button class="role-btn active" onclick="setLoginRole('murid')" id="roleBtnMurid">Murid</button>
            <button class="role-btn" onclick="setLoginRole('guru')" id="roleBtnGuru">Guru</button>
            <button class="role-btn" onclick="setLoginRole('superadmin')" id="roleBtnSuperadmin">Superadmin</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="inputLabel">Username / ID Murid</label>
                <input type="text" class="form-control" id="usernameInput" required placeholder="Masukkan ID">
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" class="form-control" id="passwordInput" required value="123456">
            </div>
            <button type="submit" class="btn-submit">Masuk Dashboard</button>
        </form>
    </div>

    <!-- ================= 2. TAMPILAN DASHBOARD ================= -->
    <div id="dashboardScreen" class="dashboard-screen hidden">
        
        <!-- HEADER BIRU -->
        <header class="header">
            <div class="header-top">
                <div class="logo-box">
                    Bimbel <span>SAINS</span>
                </div>
                
                <div class="user-section">
                    <div class="header-icons">
                        <i class="fa-regular fa-bell"></i>
                        <i class="fa-solid fa-right-from-bracket" onclick="handleLogout()" title="Keluar / Logout"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-greeting">Selamat Datang,</div>
                        <div class="user-name" id="dashName">---</div>
                        <div class="user-role-badge" id="dashRoleBadge">MURID</div>
                        <div>
                            <button class="btn-action-header" id="btnReloadData">
                                Refresh <i class="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- KONTEN UTAMA -->
        <main class="container">
            
            <!-- CARD STATISTIK DINAMIS -->
            <section class="card">
                <h2 id="cardTitle">---</h2>
                <p id="cardSub">---</p>
            </section>

            <!-- CARD PROGRAM / FITUR KELAS -->
            <section class="card" id="programCardSection">
                <span class="badge-diskon" id="dashBadge">DISKON 50%</span>
                <div class="program-header">
                    <i class="fa-solid fa-house"></i>
                    <span id="dashProgramHeader">Program StudiKu</span>
                </div>
                <p style="font-size: 11px; color: #64748b; margin-top: 4px;" id="dashProgramSub">
                    2 program aktif berjalan.
                </p>
                <button class="btn-program" id="dashProgramBtn">
                    Aksi Utama
                </button>
            </section>

            <!-- GRID MENU DINAMIS -->
            <section class="menu-grid" id="dashMenuGrid">
                <!-- Menu di-generate otomatis sesuai Role -->
            </section>

            <!-- BANNER PROMO -->
            <div class="banner-promo" id="dashBanner">
                * Untuk 10 Pendaftar Pertama di Awal Semester
            </div>

        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="bottom-nav">
            <a href="#" class="nav-link active">
                <i class="fa-solid fa-house"></i>
                <span>Beranda</span>
            </a>
            <a href="#" class="nav-link">
                <i class="fa-regular fa-calendar-check"></i>
                <span>Presensi</span>
            </a>
            
            <a href="#" class="nav-link fab-container">
                <div class="fab-btn">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
            </a>

            <a href="#" class="nav-link">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Laporan</span>
            </a>
            <a href="#" class="nav-link" onclick="handleLogout()">
                <i class="fa-solid fa-power-off"></i>
                <span>Keluar</span>
            </a>
        </nav>

    </div>

    <!-- JAVASCRIPT SYSTEM WITH LOCALSTORAGE -->
    <script>
        // Data Default Akun & Peran
        const accountsData = {
            murid: {
                name: "SUTRISNO",
                id: "M-1029",
                roleLabel: "MURID REGULER",
                cardTitle: "Siswa Reguler / Privat",
                cardSub: "Total Pertemuan: 24/30",
                badge: "DISKON 50%",
                programHeader: "Program StudiKu",
                programSub: "Anda memiliki 2 program studi aktif. Lihat detail.",
                programBtn: "Program & Privat (Guru datang ke Rumah)",
                menus: [
                    { label: "Pendaftaran Baru", icon: "fa-solid fa-user-plus", bg: "#3b82f6" },
                    { label: "Materi Belajar", icon: "fa-solid fa-book-open", bg: "#a855f7" },
                    { label: "TPA & AKM", icon: "fa-solid fa-file-lines", bg: "#14b8a6" },
                    { label: "Jadwal Kelas", icon: "fa-regular fa-clock", bg: "#22c55e" },
                    { label: "Pembayaran", icon: "fa-solid fa-wallet", bg: "#ec4899" },
                    { label: "Berita & Info", icon: "fa-regular fa-envelope", bg: "#15803d" },
                    { label: "Konsultasi", icon: "fa-regular fa-comments", bg: "#6366f1" },
                    { label: "Semua Menu", icon: "fa-solid fa-border-all", bg: "#2563eb" }
                ]
            },
            guru: {
                name: "HERI KURNIAWAN, S.Pd.",
                id: "G-5001",
                roleLabel: "GURU / PENGAJAR",
                cardTitle: "Status Pengajar Aktif",
                cardSub: "Total Jam Mengajar Minggu Ini: 18 Jam",
                badge: "GURU UTAMA",
                programHeader: "Jadwal Mengajar Hari Ini",
                programSub: "3 Kelas Privat aktif untuk sesi sore.",
                programBtn: "Input Presensi & Jurnal Kelas",
                menus: [
                    { label: "Absensi Murid", icon: "fa-solid fa-user-check", bg: "#22c55e" },
                    { label: "Jadwal Mengajar", icon: "fa-solid fa-calendar-days", bg: "#3b82f6" },
                    { label: "Input Nilai", icon: "fa-solid fa-pen-to-square", bg: "#a855f7" },
                    { label: "Materi Ajar", icon: "fa-solid fa-folder-open", bg: "#14b8a6" },
                    { label: "Honor / Gaji", icon: "fa-solid fa-money-bill-wave", bg: "#ec4899" },
                    { label: "Pesan Wali", icon: "fa-solid fa-comments", bg: "#6366f1" },
                    { label: "Evaluasi", icon: "fa-solid fa-chart-line", bg: "#15803d" },
                    { label: "Semua Menu", icon: "fa-solid fa-border-all", bg: "#2563eb" }
                ]
            },
            superadmin: {
                name: "ADMINISTRATOR UTAMA",
                id: "SA-001",
                roleLabel: "SUPERADMIN",
                cardTitle: "Panel Kendali Pusat Bimbel",
                cardSub: "Total Murid: 350 | Total Guru: 28",
                badge: "AKSES FULL",
                programHeader: "Ringkasan Keuangan & Operasional",
                programSub: "98% Pendaftaran semester ini telah terverifikasi.",
                programBtn: "Buka Management Panel",
                menus: [
                    { label: "Kelola User", icon: "fa-solid fa-users-gear", bg: "#ef4444" },
                    { label: "Keuangan", icon: "fa-solid fa-chart-pie", bg: "#f59e0b" },
                    { label: "Kelola Kelas", icon: "fa-solid fa-chalkboard", bg: "#3b82f6" },
                    { label: "Laporan Full", icon: "fa-solid fa-file-invoice", bg: "#10b981" },
                    { label: "Setting Web", icon: "fa-solid fa-gears", bg: "#6366f1" },
                    { label: "Broadcast", icon: "fa-solid fa-bullhorn", bg: "#ec4899" },
                    { label: "Database", icon: "fa-solid fa-database", bg: "#8b5cf6" },
                    { label: "Semua Menu", icon: "fa-solid fa-border-all", bg: "#2563eb" }
                ]
            }
        };

        let selectedRole = "murid";

        // Switch Tab Role di Halaman Login
        function setLoginRole(role) {
            selectedRole = role;
            document.querySelectorAll(".role-btn").forEach(btn => btn.classList.remove("active"));
            
            if(role === 'murid') {
                document.getElementById("roleBtnMurid").classList.add("active");
                document.getElementById("inputLabel").textContent = "ID / NIS Murid";
                document.getElementById("usernameInput").value = "M-1029";
            } else if(role === 'guru') {
                document.getElementById("roleBtnGuru").classList.add("active");
                document.getElementById("inputLabel").textContent = "NIP / ID Guru";
                document.getElementById("usernameInput").value = "G-5001";
            } else {
                document.getElementById("roleBtnSuperadmin").classList.add("active");
                document.getElementById("inputLabel").textContent = "Username Superadmin";
                document.getElementById("usernameInput").value = "admin_sains";
            }
        }

        // Proses Login & Simpan ke LocalStorage
        function handleLogin(event) {
            event.preventDefault();
            
            const sessionData = {
                isLoggedIn: true,
                role: selectedRole,
                loginTime: new Date().toLocaleString()
            };

            // Simpan Sesi Login ke LocalStorage
            localStorage.setItem("bimbel_session", JSON.stringify(sessionData));
            
            // Inisialisasi Database Default jika belum ada
            if(!localStorage.getItem("bimbel_accounts")) {
                localStorage.setItem("bimbel_accounts", JSON.stringify(accountsData));
            }

            renderDashboard();
        }

        // Logout & Hapus Sesi dari LocalStorage
        function handleLogout() {
            localStorage.removeItem("bimbel_session");
            document.getElementById("dashboardScreen").classList.add("hidden");
            document.getElementById("loginScreen").classList.remove("hidden");
        }

        // Render Tampilan Dashboard Berdasarkan LocalStorage
        function renderDashboard() {
            const session = JSON.parse(localStorage.getItem("bimbel_session"));
            
            if(!session || !session.isLoggedIn) {
                document.getElementById("loginScreen").classList.remove("hidden");
                document.getElementById("dashboardScreen").classList.add("hidden");
                return;
            }

            const role = session.role;
            const accounts = JSON.parse(localStorage.getItem("bimbel_accounts")) || accountsData;
            const currentUser = accounts[role];

            // Tampilkan Dashboard, Sembunyikan Login
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("dashboardScreen").classList.remove("hidden");

            // Update DOM Header
            document.getElementById("dashName").textContent = currentUser.name;
            document.getElementById("dashRoleBadge").textContent = currentUser.roleLabel;

            // Update Card Info
            document.getElementById("cardTitle").textContent = currentUser.cardTitle;
            document.getElementById("cardSub").textContent = currentUser.cardSub;

            // Update Card Program
            document.getElementById("dashBadge").textContent = currentUser.badge;
            document.getElementById("dashProgramHeader").textContent = currentUser.programHeader;
            document.getElementById("dashProgramSub").textContent = currentUser.programSub;
            document.getElementById("dashProgramBtn").textContent = currentUser.programBtn;

            // Render Menu Grid sesuai Role
            const menuGrid = document.getElementById("dashMenuGrid");
            menuGrid.innerHTML = "";
            currentUser.menus.forEach(menu => {
                const itemHTML = `
                    <div class="menu-item" onclick="alert('Akses Menu [${currentUser.roleLabel}]: ${menu.label}')">
                        <div class="icon-circle" style="background-color: ${menu.bg}">
                            <i class="${menu.icon}"></i>
                        </div>
                        <span class="menu-label">${menu.label}</span>
                    </div>
                `;
                menuGrid.insertAdjacentHTML("beforeend", itemHTML);
            });
        }

        // Cek Sesi Otomatis Saat Aplikasi Dibuka
        document.addEventListener("DOMContentLoaded", () => {
            if(!localStorage.getItem("bimbel_accounts")) {
                localStorage.setItem("bimbel_accounts", JSON.stringify(accountsData));
            }
            renderDashboard();
        });

        // Event Tombol Refresh
        document.getElementById("btnReloadData").addEventListener("click", () => {
            renderDashboard();
            alert("Data Dashboard Berhasil Diperbarui!");
        });
    </script>
</body>
</html>
