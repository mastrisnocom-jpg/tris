<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimbel SAINS - Dashboard LocalStorage</title>
    <!-- Font Awesome CDN untuk Ikon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f4f8;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding-bottom: 90px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        /* ================= HEADER BIRU ================= */
        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 20px 16px 50px 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            color: #007bff;
            font-size: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .logo-box span {
            color: #17a2b8;
        }

        .user-section {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .header-icons {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .header-icons i {
            font-size: 18px;
            cursor: pointer;
        }

        .user-details {
            text-align: right;
        }

        .user-greeting {
            font-size: 11px;
            opacity: 0.9;
            line-height: 1.2;
        }

        .user-name {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .btn-reload {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
        }

        /* ================= KONTEN UTAMA ================= */
        .container {
            padding: 0 16px;
            margin-top: -35px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        /* Card Siswa Reguler */
        .card-reguler h2 {
            font-size: 18px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .card-reguler p {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        .card-reguler p span {
            color: #0f172a;
            font-weight: 800;
        }

        /* Card Program StudiKu */
        .badge-diskon {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #1e5288;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .program-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0056b3;
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .program-sub {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 14px;
        }

        .program-sub a {
            color: #0056b3;
            text-decoration: underline;
            font-weight: 600;
        }

        .btn-program {
            background: #0056b3;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.25);
            transition: transform 0.1s ease;
        }

        .btn-program:active {
            transform: scale(0.98);
        }

        .program-tags {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 800;
            color: #334155;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Grid Menu Utama */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 12px;
            padding: 20px 12px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.15s ease;
        }

        .menu-item:active .icon-circle {
            transform: scale(0.92);
        }

        .menu-label {
            font-size: 10px;
            color: #334155;
            font-weight: 700;
            line-height: 1.25;
            max-width: 80px;
        }

        /* Banner Orange */
        .banner-promo {
            background: linear-gradient(90deg, #ff6a00, #ff8800);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(255, 106, 0, 0.25);
        }

        /* ================= BOTTOM NAVIGATION BAR ================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 65px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1000;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            flex: 1;
        }

        .nav-link i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-link.active {
            color: #007bff;
        }

        .fab-container {
            position: relative;
            top: -16px;
        }

        .fab-btn {
            width: 54px;
            height: 54px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(0, 123, 255, 0.4);
            border: 4px solid #ffffff;
        }

        .fab-btn i {
            font-size: 22px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- HEADER BIRU -->
    <header class="header">
        <div class="header-top">
            <div class="logo-box">
                Bimbel <span>SAINS</span>
            </div>
            
            <div class="user-section">
                <div class="header-icons">
                    <i class="fa-regular fa-bell"></i>
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div class="user-details">
                    <div class="user-greeting">Selamat Belajar,</div>
                    <div class="user-name" id="userName">---</div>
                    <button class="btn-reload" id="btnReload">
                        Muat Ulang <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="container">
        
        <!-- CARD 1: SISWA REGULER / PRIVAT -->
        <section class="card card-reguler">
            <h2 id="siswaType">---</h2>
            <p>Total Pertemuan: <span id="totalPertemuan">0/0</span></p>
        </section>

        <!-- CARD 2: PROGRAM STUDIKU -->
        <section class="card">
            <span class="badge-diskon" id="diskonBadge">DISKON 0%</span>
            <div class="program-header">
                <i class="fa-solid fa-house"></i>
                <span>Program StudiKu</span>
            </div>
            <p class="program-sub">
                Anda memiliki <span id="programAktifCount">0</span> program studi aktif. <a href="#">Lihat detail.</a>
            </p>
            <button class="btn-program" id="programBtnTitle">
                ---
            </button>
            <div class="program-tags" id="programTags">---</div>
        </section>

        <!-- GRID 8 MENU UTAMA (Dirennder lewat JS) -->
        <section class="menu-grid" id="menuGridContainer">
            <!-- Menu item di-generate via JavaScript -->
        </section>

        <!-- BANNER PROMO ORANGE -->
        <div class="banner-promo" id="bannerPromo">
            ---
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#" class="nav-link active" data-target="beranda">
            <i class="fa-solid fa-house"></i>
            <span>Beranda</span>
        </a>
        <a href="#" class="nav-link" data-target="presensi">
            <i class="fa-regular fa-calendar-check"></i>
            <span>Presensi</span>
        </a>
        
        <a href="#" class="nav-link fab-container" data-target="scan">
            <div class="fab-btn">
                <i class="fa-solid fa-qrcode"></i>
            </div>
        </a>

        <a href="#" class="nav-link" data-target="nilai">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Nilai</span>
        </a>
        <a href="#" class="nav-link" data-target="profil">
            <i class="fa-regular fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- JAVASCRIPT LOCALSTORAGE INTEGRATION -->
    <script>
        // 1. Data Default Aplikasi
        const defaultData = {
            user: {
                nama: "SUTRISNO",
                tipeSiswa: "Siswa Reguler / Privat",
                pertemuanHadir: 24,
                totalPertemuan: 30
            },
            program: {
                diskon: "DISKON 50%",
                jumlahAktif: 2,
                titleButton: "Program & Privat (Guru datang ke Rumah)",
                tags: "TK, SD, SMP, SMA, SMK, TPA"
            },
            banner: "* Untuk 10 Pendaftar Pertama di Awal Semester",
            menuList: [
                { id: 1, label: "Pendaftaran Murid Baru", icon: "fa-solid fa-user-plus", bg: "#3b82f6" },
                { id: 2, label: "Materi Belajar", icon: "fa-solid fa-book-open", bg: "#a855f7" },
                { id: 3, label: "TPA & AKM", icon: "fa-solid fa-file-lines", bg: "#14b8a6" },
                { id: 4, label: "Jadwal Kelas", icon: "fa-regular fa-clock", bg: "#22c55e" },
                { id: 5, label: "Pembayaran Biaya", icon: "fa-solid fa-wallet", bg: "#ec4899" },
                { id: 6, label: "Berita & Info", icon: "fa-regular fa-envelope", bg: "#15803d" },
                { id: 7, label: "Konsultasi Guru", icon: "fa-regular fa-comments", bg: "#6366f1" },
                { id: 8, label: "Semua Menu", icon: "fa-solid fa-border-all", bg: "#2563eb" }
            ]
        };

        // 2. Inisialisasi LocalStorage
        function initLocalStorage() {
            if (!localStorage.getItem("bimbel_sains_data")) {
                localStorage.setItem("bimbel_sains_data", JSON.stringify(defaultData));
            }
        }

        // 3. Fungsi Membaca Data dari LocalStorage & Merender ke DOM
        function renderFromLocalStorage() {
            initLocalStorage();
            const data = JSON.parse(localStorage.getItem("bimbel_sains_data"));

            // Render Informasi User
            document.getElementById("userName").textContent = data.user.nama;
            document.getElementById("siswaType").textContent = data.user.tipeSiswa;
            document.getElementById("totalPertemuan").textContent = `${data.user.pertemuanHadir}/${data.user.totalPertemuan}`;

            // Render Program StudiKu
            document.getElementById("diskonBadge").textContent = data.program.diskon;
            document.getElementById("programAktifCount").textContent = data.program.jumlahAktif;
            document.getElementById("programBtnTitle").textContent = data.program.titleButton;
            document.getElementById("programTags").textContent = data.program.tags;

            // Render Banner
            document.getElementById("bannerPromo").textContent = data.banner;

            // Render Grid Menu
            const menuContainer = document.getElementById("menuGridContainer");
            menuContainer.innerHTML = ""; // Bersihkan kontainer
            
            data.menuList.forEach(item => {
                const menuItemHTML = `
                    <div class="menu-item" onclick="onMenuClick('${item.label}')">
                        <div class="icon-circle" style="background-color: ${item.bg}">
                            <i class="${item.icon}"></i>
                        </div>
                        <span class="menu-label">${item.label}</span>
                    </div>
                `;
                menuContainer.insertAdjacentHTML("beforeend", menuItemHTML);
            });
        }

        // 4. Event Handler Tombol "Muat Ulang" (Reset / Refresh LocalStorage)
        document.getElementById("btnReload").addEventListener("click", () => {
            // Contoh aksi muat ulang: menambah hitungan pertemuan di localStorage
            let currentData = JSON.parse(localStorage.getItem("bimbel_sains_data"));
            
            // Tambah 1 pertemuan jika belum maksimal
            if (currentData.user.pertemuanHadir < currentData.user.totalPertemuan) {
                currentData.user.pertemuanHadir += 1;
            } else {
                currentData.user.pertemuanHadir = 1; // Reset jika sudah penuh
            }

            // Simpan kembali data yang baru
            localStorage.setItem("bimbel_sains_data", JSON.stringify(currentData));

            // Render ulang tampilan
            renderFromLocalStorage();
        });

        // 5. Event Handler Menu Navigasi Bawah
        const navLinks = document.querySelectorAll(".bottom-nav .nav-link");
        navLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });

        // 6. Fungsi Klik Menu Utama
        function onMenuClick(menuName) {
            alert(`Membuka menu: ${menuName}`);
        }

        // Jalankan render saat dokumen selesai dimuat
        document.addEventListener("DOMContentLoaded", renderFromLocalStorage);
    </script>
</body>
</html>
