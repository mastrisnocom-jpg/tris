<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Short Maker - Instant & Fast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .phone-container {
            width: 100%;
            max-width: 380px;
            background: #111827;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            border: 2px solid #374151;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h2 {
            text-align: center;
            font-size: 1.15rem;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        
        /* PLAYER 9:16 INSTAN DENGAN OVERLAY TEKS */
        .video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #4b5563;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-overlay {
            position: absolute;
            top: 15%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 15px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .preview-text {
            background: rgba(0, 0, 0, 0.8);
            color: #facc15;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.4;
            max-width: 100%;
            word-break: break-word;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            border: 2px solid rgba(250, 204, 21, 0.5);
            display: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .placeholder-text {
            position: absolute;
            color: #9ca3af;
            font-size: 0.8rem;
            text-align: center;
            padding: 0 20px;
            z-index: 5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        textarea {
            resize: none;
            overflow: hidden;
            min-height: 55px;
            line-height: 1.4;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
        }
        input[type="file"] {
            padding: 6px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-ai {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
        }
        .btn-ready {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(16, 185, 129,-0.4);
        }
        #status {
            text-align: center;
            font-size: 0.78rem;
            color: #facc15;
            min-height: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <h2>⚡ Instant Shorts Generator</h2>

        <!-- PLAYER 9:16 DENGAN LIVE OVERLAY TEKS -->
        <div class="video-box" id="videoBox">
            <span class="placeholder-text" id="placeholderText">Pilih video di bawah untuk mulai</span>
            <div class="preview-overlay">
                <div class="preview-text" id="previewText"></div>
            </div>
            <video id="outputVideo" controls playsinline loop></video>
        </div>

        <p id="status"></p>

        <!-- PENGATURAN API GEMINI -->
        <div class="input-group">
            <label>Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Tempel API Key di sini..." oninput="saveApiKey()">
        </div>

        <!-- INPUT TOPIK & AI HOOK YANG LEBIH KAYA -->
        <div class="input-group">
            <label>Topik Video untuk AI:</label>
            <input type="text" id="topicInput" placeholder="Cth: Cara cepat kaya di usia muda...">
            <button class="btn-ai" onclick="generateGeminiHook()">Buat Hook Menarik & Panjang 🤖</button>
        </div>

        <!-- FORM TEXTAREA FLEKSIBEL -->
        <div class="input-group">
            <label>Teks Hook (Bisa diperpanjang / diedit):</label>
            <textarea id="hookText" placeholder="Teks hook akan tampil di sini..." oninput="autoResize(this); updatePreview();"></textarea>
        </div>

        <!-- UPLOAD VIDEO -->
        <div class="input-group">
            <label>Upload Video Mentah:</label>
            <input type="file" id="uploader" accept="video/*" onchange="loadVideoToPlayer(event)">
        </div>

        <!-- INFORMASI INSTAN -->
        <button class="btn-ready" onclick="alert('Video dan Teks Hook sudah aktif secara real-time! Anda bisa langsung screen record atau gunakan langsung.')">✨ Siap Digunakan (Tanpa Loading)</button>
    </div>

    <script>
        // Memuat data tersimpan
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            const savedHook = localStorage.getItem('saved_hook_text');

            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            if (savedHook) {
                const hookArea = document.getElementById('hookText');
                hookArea.value = savedHook;
                autoResize(hookArea);
                updatePreview();
            }
        });

        function saveApiKey() {
            localStorage.setItem('gemini_api_key', document.getElementById('apiKeyInput').value.trim());
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function updatePreview() {
            const hookText = document.getElementById('hookText').value.trim();
            const previewDiv = document.getElementById('previewText');

            if (hookText) {
                previewDiv.innerText = hookText;
                previewDiv.style.display = 'block';
            } else {
                previewDiv.style.display = 'none';
            }
        }

        function loadVideoToPlayer(event) {
            const file = event.target.files[0];
            if (file) {
                const videoElem = document.getElementById('outputVideo');
                const placeholder = document.getElementById('placeholderText');
                
                videoElem.src = URL.createObjectURL(file);
                placeholder.style.display = 'none';
                updatePreview();
            }
        }

        async function generateGeminiHook() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const topic = document.getElementById('topicInput').value.trim();
            const status = document.getElementById('status');

            if (!apiKey) {
                alert('Masukkan Gemini API Key terlebih dahulu!');
                return;
            }
            if (!topic) {
                alert('Masukkan topik video terlebih dahulu!');
                return;
            }

            status.innerText = 'AI sedang meracik hook yang provokatif...';

            try {
                // Prompt diperluas agar teks hook lebih kaya, tidak terlalu sedikit/pendek
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Buat 2 kalimat hook pendek yang sangat kuat, menarik, dan memancing rasa penasaran untuk video short dengan topik: "${topic}". Berikan teksnya saja tanpa tanda kutip, tanpa nomor, dan buat agar pas dibaca dalam 3 detik pertama.` }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiHook = data.candidates[0].content.parts[0].text.trim();
                const hookArea = document.getElementById('hookText');
                
                hookArea.value = aiHook;
                autoResize(hookArea);
                updatePreview();

                localStorage.setItem('saved_hook_text', aiHook);
                status.innerText = 'Hook berhasil dibuat!';
            } catch (error) {
                console.error(error);
                status.innerText = 'Gagal memanggil Gemini. Cek API Key Anda.';
            }
        }

        document.getElementById('hookText').addEventListener('input', () => {
            localStorage.setItem('saved_hook_text', document.getElementById('hookText').value);
        });
    </script>
</body>
</html>
