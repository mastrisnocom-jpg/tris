<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Short Maker Pro - Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .phone-container {
            width: 100%;
            max-width: 380px;
            background: #111827;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            border: 2px solid #374151;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h2 {
            text-align: center;
            font-size: 1.15rem;
            background: linear-gradient(to right, #38bdf8, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        
        /* PLAYER 9:16 DI ATAS DENGAN PREVIEW TEKS REAL-TIME */
        .video-box {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #4b5563;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }
        .preview-text {
            background: rgba(0, 0, 0, 0.75);
            color: #facc15;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            line-height: 1.4;
            max-width: 90%;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(250, 204, 21, 0.3);
            display: none;
        }
        .placeholder-text {
            color: #9ca3af;
            font-size: 0.8rem;
            text-align: center;
            padding: 0 20px;
            z-index: 1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        textarea {
            resize: none;
            overflow: hidden;
            min-height: 45px;
            line-height: 1.4;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8;
        }
        input[type="file"] {
            padding: 6px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-ai {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
        }
        .btn-render {
            background: linear-gradient(135deg, #db2777, #e11d48);
            color: white;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
        }
        #status {
            text-align: center;
            font-size: 0.78rem;
            color: #facc15;
            min-height: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <h2>⚡ Ultimate AI Shorts</h2>

        <!-- 1. PLAYER 9:16 DI ATAS DENGAN LIVE PREVIEW TEKS -->
        <div class="video-box" id="videoBox">
            <span class="placeholder-text" id="placeholderText">Preview 9:16 (Masukkan hook / video)</span>
            <div class="preview-overlay">
                <div class="preview-text" id="previewText"></div>
            </div>
            <video id="outputVideo" controls playsinline></video>
        </div>

        <p id="status"></p>

        <!-- 2. PENGATURAN API GEMINI (TERSIMPAN OTOMATIS) -->
        <div class="input-group">
            <label>Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Tempel API Key di sini..." oninput="saveApiKey()">
        </div>

        <!-- 3. INPUT TOPIK & AI HOOK -->
        <div class="input-group">
            <label>Topik Video untuk AI:</label>
            <input type="text" id="topicInput" placeholder="Cth: Rahasia sukses anak muda...">
            <button class="btn-ai" onclick="generateGeminiHook()">Buat Hook Estetik 🤖</button>
        </div>

        <!-- FORM TEXTAREA OTOMATIS MENYESUAIKAN PANJANG TEKS -->
        <div class="input-group">
            <label>Teks Hook Dinamis (Bisa diedit manual):</label>
            <textarea id="hookText" placeholder="Hasil teks hook dari AI..." oninput="autoResize(this); updatePreview();"></textarea>
        </div>

        <!-- 4. UPLOAD VIDEO -->
        <div class="input-group">
            <label>Upload Video Mentah:</label>
            <input type="file" id="uploader" accept="video/*">
        </div>

        <!-- TOMBOL PROSES -->
        <button class="btn-render" onclick="prosesCinematicShort()">✨ Render Video Modern 9:16</button>
    </div>

    <!-- Pustaka FFmpeg.wasm -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        // Memuat data yang tersimpan saat halaman dibuka (Persistence)
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            const savedHook = localStorage.getItem('saved_hook_text');

            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
            if (savedHook) {
                const hookArea = document.getElementById('hookText');
                hookArea.value = savedHook;
                autoResize(hookArea);
                updatePreview();
            }
        });

        // Simpan API Key ke LocalStorage otomatis
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
        }

        // Auto-resize Textarea agar tidak tertutup dan pas dengan isinya
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Live Preview Teks di Player secara Instan
        function updatePreview() {
            const hookText = document.getElementById('hookText').value.trim();
            const previewDiv = document.getElementById('previewText');
            const placeholder = document.getElementById('placeholderText');
            const videoElem = document.getElementById('outputVideo');

            // Jika sedang tidak memutar video hasil render, tampilkan preview teks di atas box hitam
            if (videoElem.style.display !== 'block') {
                if (hookText) {
                    previewDiv.innerText = hookText;
                    previewDiv.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    previewDiv.style.display = 'none';
                    placeholder.style.display = 'block';
                }
            }
        }

        // Fungsi Memanggil Google Gemini API
        async function generateGeminiHook() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const topic = document.getElementById('topicInput').value.trim();
            const status = document.getElementById('status');

            if (!apiKey) {
                alert('Masukkan Gemini API Key terlebih dahulu!');
                return;
            }
            if (!topic) {
                alert('Masukkan topik video terlebih dahulu!');
                return;
            }

            status.innerText = 'AI sedang meracik hook estetik...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Buat 1 kalimat hook super pendek, provokatif, dan berpotensi viral untuk video pendek dengan topik: "${topic}". Berikan teksnya saja tanpa tanda kutip dan tanpa format tambahan.` }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiHook = data.candidates[0].content.parts[0].text.trim();
                const hookArea = document.getElementById('hookText');
                
                hookArea.value = aiHook;
                autoResize(hookArea);
                updatePreview();

                // Simpan ke riwayat lokal
                localStorage.setItem('saved_hook_text', aiHook);

                status.innerText = 'Hook estetik berhasil dibuat & disimpan!';
            } catch (error) {
                console.error(error);
                status.innerText = 'Gagal memanggil Gemini. Cek kembali API Key Anda.';
            }
        }

        // Simpan riwayat teks hook manual saat diketik
        document.getElementById('hookText').addEventListener('input', () => {
            const hookText = document.getElementById('hookText').value;
            localStorage.setItem('saved_hook_text', hookText);
        });

        // Fungsi Render Video dengan FFmpeg
        async function prosesCinematicShort() {
            const fileInput = document.getElementById('uploader').files[0];
            const hookText = document.getElementById('hookText').value.trim();
            const status = document.getElementById('status');

            if (!fileInput) {
                alert('Silakan pilih file video mentah terlebih dahulu!');
                return;
            }
            if (!hookText) {
                alert('Teks hook belum ada!');
                return;
            }

            status.innerText = 'Memuat engine video (pertama kali agak lama)...';
            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }

            status.innerText = 'Merender video 9:16 + Animasi Teks Dinamis...';
            
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(fileInput));

            await ffmpeg.run(
                '-i', 'input.mp4',
                '-vf', `scale=ih*9/16:ih,crop=ih*9/16:ih,drawtext=text='${hookText}':fontcolor=yellow:fontsize=50:box=1:boxcolor=black@0.7:boxborderw=20:x=(w-text_w)/2:y='if(lt(t,3), h - (t*120), (h-text_h)/2)'`,
                '-t', '15',
                '-c:v', 'libx264',
                '-preset', 'ultrafast',
                'output.mp4'
            );

            status.innerText = 'Selesai! Video Short modern Anda siap.';
            const data = ffmpeg.FS('readFile', 'output.mp4');

            const video = document.getElementById('outputVideo');
            const placeholder = document.getElementById('placeholderText');
            const previewDiv = document.getElementById('previewText');
            
            previewDiv.style.display = 'none';
            placeholder.style.display = 'none';
            video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            video.style.display = 'block';
        }
    </script>
</body>
</html>
